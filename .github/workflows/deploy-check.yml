name: Deploy Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy-check:
    name: Deploy Prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for uncommitted secrets
        run: |
          echo "Checking for potential secrets in code..."
          ! grep -r "sk_live\|pk_live\|ghp_\|gho_\"" --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" src/ 2>/dev/null
          echo "No live secrets found"

      - name: Verify environment variables
        run: |
          required_vars=(
            "DATABASE_URL"
            "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            "CLERK_SECRET_KEY"
            "GROQ_API_KEY"
          )
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "Warning: $var is not set (expected for PRs)"
            fi
          done

      - name: Bundle analysis
        run: npx next build --no-lint

      - name: Check bundle size
        run: |
          max_size_mb=10
          actual_size=$(du -sm .next | cut -f1)
          echo "Bundle size: ${actual_size}MB"
          if [ "$actual_size" -gt "$max_size_mb" ]; then
            echo "Warning: Bundle exceeds ${max_size_mb}MB"
          fi

      - name: Verify API routes
        run: |
          echo "Checking critical API routes..."
          expected_routes=(
            "src/app/api/analyze/route.js"
            "src/app/api/upload/route.js"
            "src/app/api/chat/route.js"
          )
          for route in "${expected_routes[@]}"; do
            if [ -f "$route" ]; then
              echo "✓ $route exists"
            else
              echo "✗ $route missing — deployment may break"
            fi
          done